<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1M Checkboxes</title>
    <style>
        :root {
            --carbon-black: #000000;
            --carbon-ink: #0a0b0e;
            --carbon-slate: #1a1f26;
            --carbon-smoke: #2a313b;
            --carbon-glow: #00e7ff;
            --carbon-accent: #ffb454;
            --carbon-mint: #7bd88f;
            --carbon-text: #e6f1ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--carbon-black);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0, 231, 255, 0.15), transparent 45%),
                radial-gradient(circle at 80% 0%, rgba(255, 180, 84, 0.18), transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(123, 216, 143, 0.12), transparent 50%),
                linear-gradient(180deg, rgba(26, 31, 38, 0.6), rgba(0, 0, 0, 0.9));
            color: var(--carbon-text);
            font-family: 'Vira Carbon', 'Space Grotesk', 'Archivo', 'Manrope', sans-serif;
            padding: 48px 20px 64px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '1M Checkboxes';
            display: block;
            text-align: center;
            color: var(--carbon-text);
            font-size: clamp(2.2rem, 3vw + 1rem, 3.6rem);
            font-weight: 700;
            letter-spacing: 0.2rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(0, 231, 255, 0.35);
            animation: titleRise 0.9s ease-out both;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
            gap: 14px;
            max-width: 1480px;
            margin: 0 auto;
            padding: 32px;
            background:
                linear-gradient(135deg, rgba(10, 11, 14, 0.9), rgba(26, 31, 38, 0.65)),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.03),
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 18px
                );
            border-radius: 24px;
            border: 1px solid rgba(0, 231, 255, 0.2);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            animation: gridReveal 0.8s ease-out both;
        }

        input[type="checkbox"] {
            width: 34px;
            height: 34px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(160deg, var(--carbon-ink), var(--carbon-slate));
            border: 1px solid rgba(0, 231, 255, 0.35);
            border-radius: 10px;
            display: grid;
            place-items: center;
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 10px 20px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        input[type="checkbox"]::after {
            content: '';
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: rgba(0, 231, 255, 0.2);
            transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        input[type="checkbox"]:hover {
            transform: translateY(-2px) scale(1.08);
            border-color: var(--carbon-mint);
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.5),
                0 0 18px rgba(0, 231, 255, 0.35);
        }

        input[type="checkbox"]:checked {
            border-color: var(--carbon-accent);
            box-shadow:
                0 16px 34px rgba(0, 0, 0, 0.6),
                0 0 24px rgba(255, 180, 84, 0.55);
        }

        input[type="checkbox"]:checked::after {
            transform: scale(1.4);
            background: linear-gradient(140deg, var(--carbon-glow), var(--carbon-accent));
            box-shadow: 0 0 12px rgba(0, 231, 255, 0.7);
        }

        input[type="checkbox"]:focus {
            outline: none;
            border-color: var(--carbon-glow);
            box-shadow:
                0 0 0 2px rgba(0, 231, 255, 0.5),
                0 0 28px rgba(0, 231, 255, 0.5);
        }

        input[type="checkbox"]:active {
            transform: scale(0.98);
        }

        @keyframes titleRise {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gridReveal {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        const socket = io();

        const container = document.getElementById('container');

        socket.on('server:checkbox:update', (data) => {
            console.log(`Socket Server Event { index: ${data.index}, isChecked: ${data.isChecked} }`);

            const { index, isChecked } = data;

            const checkbox = document.getElementById(`checkbox-${data.index}`);
            checkbox.checked = data.isChecked;
        });

        window.addEventListener('load', async () => {
                const response = await fetch('/checkboxes');

                const data = await response.json();

                if (data?.checkboxes) {
                    data.checkboxes.forEach((isChecked, index) => {

                        const checkbox = document.createElement('input');

                        checkbox.type = 'checkbox';
                        checkbox.id = `checkbox-${index}`;
                        checkbox.checked = isChecked;

                        checkbox.addEventListener('change', () => {
                            socket.emit(
                                'client:checkbox:change',
                                {
                                    index,
                                    isChecked: checkbox.checked
                                }
                            );
                        });

                        container.appendChild(checkbox);
                    });
                }
            });
    </script>
</body>
</html>
